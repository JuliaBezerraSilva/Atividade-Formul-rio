<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Aula Formulário</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
</head>
<body>
   <form>
        <label for="nome">Nome</label>
        <input 
        type="text" 
        id="nome" 
        name="nome"
        required
        >
        
        <br><br>
        <label for="email">E-mail</label>
        <input 
        type="email" 
        id="email" 
        name="email"
        required
        >

        <br><br>
        <label for="nascimento"> Data de nascimento</label>
        <input
            type="date"
            id="nascimento"
            name="nascimento"
            required
        >
        <br> <br>
        <label for="curso">Curso</label>
        <select id="curso" name="curso">
            <option value="">
                Selecione
            </option>
            <option value="al">
                Alimentos
            </option>
            <option value="ds">
                Desenvolvimento de Sistemas
            </option>
            <option value="in">
                Instrumentação
            </option>

        </select>
        <br> <br>

        <p>Turno</p>
        <input type="radio" id="manha" name="turno" value="manha">
        <label for="manha">Manhã</label>
        <input type="radio" id="tarde" name="turno" value="tarde">
        <label for="tarde">Tarde</label>
        <input type="radio" id="noite" name="turno" value="noite">
        <label for="noite">Noite</label>
        <br><br>
        <label for="observacoes">Observações</label>
        <br><br>
        <textarea
            id="observacoes"
            name="observacoes"
            rows="5"
            cols="40"
        >
        </textarea>
        <br><br>
        <input 
        type="checkbox" 
        id="termos" 
        name="termos"
        required>
        <label for="termos">Aceito os termos</label>
        <br><br>
        <button type="submit">Cadastrar</button>
        <button type="reset">Limpar</button>
    </form> 
    
</body>
</html>
